<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPP Network Wrapper — Live Demo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="/build/libv86.js"></script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0e0f0d;
        --surface: #131410;
        --surface-2: #1e201a;
        --border: #2e3028;
        --border-2: #383c30;
        --text: #d8d8d0;
        --muted: #787870;
        --faint: #545450;
        --primary: #2ec896;
        --primary-h: #1aaa7c;
        --primary-d: oklch(from #2ec896 l c h / 0.12);
        --mono: "JetBrains Mono", monospace;
        --body: "Inter", system-ui, sans-serif;
        --radius: 0.5rem;
        --radius-lg: 0.75rem;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--body);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Layout ── */
      .app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100dvh;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1.25rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        gap: 1rem;
        flex-wrap: wrap;
      }
      .header__title {
        font-family: var(--mono);
        font-size: 0.875rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .header__title svg {
        color: var(--primary);
      }
      .header__badge {
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 500;
        color: var(--primary);
        background: var(--primary-d);
        border: 1px solid oklch(from var(--primary) l c h / 0.25);
        padding: 2px 0.5rem;
        border-radius: 999px;
      }
      .header__status {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
        transition: background 0.3s;
      }
      .status-dot.ready {
        background: var(--primary);
        box-shadow: 0 0 6px oklch(from var(--primary) l c h / 0.5);
      }
      .status-dot.running {
        background: #f0a500;
        box-shadow: 0 0 6px #f0a50060;
        animation: pulse 1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* ── Main grid ── */
      .main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr auto;
        gap: 0;
        overflow: hidden;
        height: 100%;
      }

      /* ── Pane ── */
      .pane {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        overflow: hidden;
      }
      .pane:last-child {
        border-right: none;
      }

      .pane__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 1rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .pane__label {
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .pane__hint {
        font-size: 0.7rem;
        color: var(--faint);
      }
      .pane__hint kbd {
        font-family: var(--mono);
        background: var(--surface-2);
        border: 1px solid var(--border-2);
        border-radius: 3px;
        padding: 1px 4px;
        font-size: 0.65rem;
      }

      .pane__editor {
        flex: 1;
        padding: 0.75rem 1rem;
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        font-size: 0.8125rem;
        line-height: 1.6;
        border: none;
        resize: none;
        outline: none;
        tab-size: 2;
        white-space: pre;
        overflow-wrap: normal;
        overflow-x: auto;
      }
      .pane__editor:focus {
        box-shadow: inset 0 0 0 1px oklch(from var(--primary) l c h / 0.3);
      }

      .pane__footer {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        background: var(--surface);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }

      /* ── Run button ── */
      .btn-run {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        padding: 0.375rem 0.875rem;
        background: var(--primary);
        color: #0e0f0d;
        font-family: var(--mono);
        font-size: 0.75rem;
        font-weight: 700;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .btn-run:hover:not(:disabled) {
        background: var(--primary-h);
      }
      .btn-run:active:not(:disabled) {
        transform: scale(0.97);
      }
      .btn-run:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn-run svg {
        flex-shrink: 0;
      }

      /* ── Output row ── */
      .output-row {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-top: 1px solid var(--border);
        max-height: 180px;
        flex-shrink: 0;
      }

      .output-pane {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        overflow: hidden;
      }
      .output-pane:last-child {
        border-right: none;
      }

      .output-pane__header {
        padding: 0.35rem 1rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        flex-shrink: 0;
      }

      .output-pane__content {
        flex: 1;
        overflow-y: auto;
        padding: 0.625rem 1rem;
        font-family: var(--mono);
        font-size: 0.8rem;
        line-height: 1.55;
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-all;
      }
      .output-pane__content::-webkit-scrollbar {
        width: 4px;
      }
      .output-pane__content::-webkit-scrollbar-track {
        background: transparent;
      }
      .output-pane__content::-webkit-scrollbar-thumb {
        background: var(--border-2);
        border-radius: 2px;
      }

      .output--status {
        color: var(--primary);
      }
      .output--result {
        color: #a8d8a8;
      }

      /* ── V86 terminal (hidden, needed for emulator) ── */
      #screen_container {
        display: none;
      }

      /* ── Loading overlay ── */
      .loading-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        z-index: 100;
        transition: opacity 0.4s;
      }
      .loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loading-overlay.gone {
        display: none;
      }

      .loading-spinner {
        width: 36px;
        height: 36px;
        border: 2px solid var(--border-2);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--muted);
      }
      .loading-sub {
        font-size: 0.7rem;
        color: var(--faint);
      }

      /* ── Responsive ── */
      @media (max-width: 600px) {
        .main {
          grid-template-columns: 1fr;
        }
        .output-row {
          grid-template-columns: 1fr;
          max-height: 220px;
        }
        .pane {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
        .output-pane {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loading-text">Booting Alpine Linux…</div>
      <div class="loading-sub" id="loading-sub">
        This may take 10–30 seconds on first load
      </div>
    </div>

    <div class="app">
      <!-- Header -->
      <header class="header">
        <div class="header__title">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
          CPP Network Wrapper
          <span class="header__badge">Live Demo</span>
        </div>
        <div class="header__status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Booting…</span>
        </div>
      </header>

      <!-- Editor + output -->
      <div class="main">
        <!-- Client pane -->
        <div class="pane">
          <div class="pane__header">
            <span class="pane__label">Client</span>
            <span class="pane__hint"
              ><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to run</span
            >
          </div>
          <textarea
            class="pane__editor"
            id="source"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
          ></textarea>
          <div class="pane__footer">
            <button class="btn-run" id="run" disabled>
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <polygon points="5 3 19 12 5 21 5 3" />
              </svg>
              Run Client
            </button>
          </div>
        </div>

        <!-- Server pane -->
        <div class="pane">
          <div class="pane__header">
            <span class="pane__label">Server</span>
            <span class="pane__hint"
              ><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to run</span
            >
          </div>
          <textarea
            class="pane__editor"
            id="source_server"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
          ></textarea>
          <div class="pane__footer">
            <button class="btn-run" id="run1" disabled>
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <polygon points="5 3 19 12 5 21 5 3" />
              </svg>
              Run Server
            </button>
          </div>
        </div>

        <!-- Output row -->
        <div class="output-row">
          <div class="output-pane">
            <div class="output-pane__header">Status</div>
            <pre class="output-pane__content output--status" id="status"></pre>
          </div>
          <div class="output-pane">
            <div class="output-pane__header">Output</div>
            <pre class="output-pane__content output--result" id="result"></pre>
          </div>
        </div>
      </div>
    </div>

    <!-- Hidden V86 screen container (required by emulator) -->
    <div id="screen_container">
      <div
        style="white-space: pre; font: 14px monospace; line-height: 14px"
      ></div>
      <canvas style="display: none"></canvas>
    </div>

    <script>
      "use strict";

      var example_code = `#include "TCP/TCPClient.h"
char Ip[] = "127.0.0.1";

int main() {
  Networking::TCPClient MyClient(Networking::IPV4, 7864, Ip, 0);
  char *Message;
  int res = MyClient.Receive(Message);

  std::cout << Message << "\\r\\n";
  return 0;
}`;

      var example_code_server = `#include "TCP/TCPServer.h"
char Ip[] = "0.0.0.0";

void TCP_Server_Loop(Networking::TCPServer *server, SOCKET sock, SSL *ssl) {
  std::cout << "Client connected" << std::endl;
  char *Message = "Hello";
  server->Send(sock, Message);
  std::cout << "Message sent" << std::endl;
  closesocket(sock);
}

int main() {
  Networking::TCPServer MyServer(Networking::IPV4, 7865, Ip, 0);
  MyServer.StartListening(TCP_Server_Loop);
  return 0;
}`;

      document.getElementById("source").value = example_code;
      document.getElementById("source_server").value = example_code_server;

      // ── Emulator ──
      var emulator = new V86({
        wasm_path: "/build/v86.wasm",
        memory_size: 1024 * 1024 * 1024,
        vga_memory_size: 8 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: { url: "/bios/seabios.bin" },
        vga_bios: { url: "/bios/vgabios.bin" },
        filesystem: {
          baseurl: "/images/alpine-rootfs-flat",
          basefs: "/images/alpine-fs.json",
        },
        bzimage_initrd_from_filesystem: true,
        cmdline:
          "rw root=host9p rootfstype=9p rootflags=trans=virtio,cache=loose modules=virtio_pci tsc=reliable",
        initial_state: { url: "/images/alpine-state.bin" },
        autostart: true,
      });

      // ── State ──
      var statusDot = document.getElementById("status-dot");
      var statusText = document.getElementById("status-text");
      var overlay = document.getElementById("loading");
      var isReady = false;
      var bootBuffer = "";

      // Separate output capture per panel — null means not capturing
      var captureTarget = null; // "client" | "server" | null

      // Strip ANSI / VT100 escape sequences (e.g. [6n, [?25h, colors)
      function stripAnsi(str) {
        return str
          .replace(/\x1b\[[0-9;]*[a-zA-Z]/g, "") // CSI sequences
          .replace(/\x1b[^[]/g, "") // other ESC sequences
          .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, ""); // control chars except \t \n \r
      }

      // Loading message rotator
      var loadingMsgs = [
        "Booting Alpine Linux\u2026",
        "Loading kernel\u2026",
        "Mounting filesystem\u2026",
        "Starting init\u2026",
        "Almost ready\u2026",
      ];
      var loadingIdx = 0;
      var loadingInterval = setInterval(function () {
        loadingIdx = (loadingIdx + 1) % loadingMsgs.length;
        var el = document.getElementById("loading-text");
        if (el) el.textContent = loadingMsgs[loadingIdx];
      }, 4000);

      function setReady() {
        if (isReady) return;
        isReady = true;
        clearInterval(loadingInterval);
        setStatus("ready", "Ready");
        document.getElementById("run").disabled = false;
        document.getElementById("run1").disabled = false;
        overlay.classList.add("hidden");
        setTimeout(function () {
          overlay.classList.add("gone");
        }, 450);
        document.getElementById("status").textContent =
          "Ready \u2014 press Run Server first, then Run Client.\n";
      }

      function setStatus(state, text) {
        statusDot.className = "status-dot " + state;
        statusText.textContent = text;
      }

      // ── Serial output listener ──
      var lineBuffer = "";
      emulator.add_listener("serial0-output-byte", function (byte) {
        var ch = String.fromCharCode(byte);

        // Boot detection
        if (!isReady) {
          if (ch !== "\r") bootBuffer += ch;
          if (bootBuffer.length > 512) bootBuffer = bootBuffer.slice(-512);
          var prompts = ["localhost:~#", "localhost:/#", ":~#"];
          for (var i = 0; i < prompts.length; i++) {
            if (bootBuffer.indexOf(prompts[i]) !== -1) {
              setReady();
              break;
            }
          }
        }

        // Output capture — only when a panel is actively capturing
        if (captureTarget !== null) {
          lineBuffer += ch;
          // Flush on newline
          if (ch === "\n") {
            var clean = stripAnsi(lineBuffer).replace(/\r/g, "");
            var targetId = captureTarget === "client" ? "result" : "result";
            document.getElementById("result").textContent += clean;
            lineBuffer = "";
          }
        }
      });

      emulator.add_listener("emulator-ready", function () {
        setTimeout(setReady, 3000);
      });
      setTimeout(setReady, 30000);

      // ── Run Client ──
      document
        .getElementById("source")
        .addEventListener("keydown", function (e) {
          if (e.keyCode === 13 && e.ctrlKey)
            document.getElementById("run").click();
        });

      document.getElementById("run").onclick = function () {
        var code = document.getElementById("source").value;
        document.getElementById("result").textContent = "";
        document.getElementById("status").textContent =
          "Running client\u2026\n";
        setStatus("running", "Running\u2026");
        captureTarget = "client";
        this.disabled = true;
        var btn = this;

        if (code === example_code) {
          emulator.serial0_send("./Client\r\n");
        } else {
          emulator.serial0_send(
            "echo " +
              bashEscape(code) +
              " | g++ -xc++ -o /tmp/prog /root/c_network/include/TCP/TCPClient.cpp - -lssl -lcrypto -I/root/c_network/include && /tmp/prog \r\n",
          );
        }

        setTimeout(function () {
          captureTarget = null;
          btn.disabled = false;
          setStatus("ready", "Ready");
        }, 6000);
      };

      // ── Run Server ──
      document
        .getElementById("source_server")
        .addEventListener("keydown", function (e) {
          if (e.keyCode === 13 && e.ctrlKey)
            document.getElementById("run1").click();
        });

      document.getElementById("run1").onclick = function () {
        var code = document.getElementById("source_server").value;
        document.getElementById("status").textContent =
          "Server starting\u2026\n";
        setStatus("running", "Starting server\u2026");
        // Server runs in background — don't capture output into result panel
        captureTarget = null;
        this.disabled = true;
        var btn = this;

        if (code === example_code_server) {
          emulator.serial0_send(
            "kill -9 $(pidof Server) 2>/dev/null; kill -9 $(pidof prog1) 2>/dev/null; ./Server &\r\n",
          );
        } else {
          emulator.serial0_send(
            "kill -9 $(pidof Server) 2>/dev/null; kill -9 $(pidof prog1) 2>/dev/null; echo " +
              bashEscape(code) +
              " | g++ -xc++ -o /tmp/prog1 /root/c_network/include/TCP/TCPServer.cpp - -lssl -lcrypto -I/root/c_network/include && /tmp/prog1 &\r\n",
          );
        }

        setTimeout(function () {
          btn.disabled = false;
          setStatus("ready", "Server running \u2014 now press Run Client");
          document.getElementById("status").textContent =
            "Server running \u2014 now press Run Client.\n";
        }, 2000);
      };

      function bashEscape(arg) {
        arg = arg.replace(/\t+/g, "");
        return (
          "'" +
          arg.replace(/\'+/g, function (val) {
            return "'" + val.replace(/'/g, "\\'") + "'";
          }) +
          "'"
        );
      }
    </script>
  </body>
</html>
